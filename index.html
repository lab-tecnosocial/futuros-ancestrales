<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mapa de Moxos - Futuros Ancestrales</title>
  <meta property="og:image" content="https://lab-tecnosocial.github.io/preview.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Mapa de Moxos - Futuros Ancestrales" />
  <meta property="og:description"
    content="Este mapa honra la soberanía y autonomía de los pueblos indígenas de Moxos." />

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <nav style="display: flex; justify-content: space-between; align-items: center;">
    <a href="index.html">
      <h3>FUTUROS ANCESTRALES</h3>
    </a>
    <!-- Hamburger menu for mobile -->
    <div class="menu-container">
      <div class="menu-items">
        <a class="menu-item" href="nosotrxs.html">Nosotrxs</a>
        <a class="menu-item" href="cartografias.html">Cartografías anticoloniales</a>
        <a class="menu-item" href="contacto.html">Contacto</a>
        <a class="menu-item" id="translate-btn" onclick="translatePage()">Translate</a>
      </div>
      <button class="hamburger" aria-label="Abrir menú">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    <script>
      const hamburger = document.querySelector('.hamburger');
      const menuItems = document.querySelector('.menu-items');
      hamburger.addEventListener('click', () => {
        menuItems.classList.toggle('show');
      });
    </script>
    <style>
      .menu-container {
        display: flex;
        align-items: center;
      }

      .menu-items {
        display: flex;
        gap: 25px;
        color: white;
      }

      .hamburger {
        display: none;
        background: none;
        border: none;
        color: white;
        font-size: 1.8em;
        margin-left: 15px;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        .menu-items {
          display: none;
          position: absolute;
          top: 60px;
          right: 20px;
          background: #222;
          flex-direction: column;
          gap: 15px;
          padding: 20px;
          border-radius: 8px;
          z-index: 1000;
        }

        .menu-items.show {
          display: flex;
        }

        .hamburger {
          display: block;
          padding-inline: 10px;
        }
      }
    </style>
    </div>
  </nav>
  <div id="lab-modal"
    style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(30,30,30,0.95);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2000;">
    <div class="text-block" style="text-align: center; font-family: 'Roboto Condensed', sans-serif; font-size: 20px;">
      Estos son los Futuros Ancestrales. Este mapa busca honrar la soberanía y autonomía de los pueblos indígenas, sus
      datos, y las representaciones que de ellos emergen para fabulaciones de hoy, ayer y mañana.
    </div>
    <button id="close-modal"
      style="font-family: 'Roboto Condensed'; padding:12px 32px;font-size:20px;background:#2E593E;color:#fff;border:none;border-radius:6px;cursor:pointer;">
      Continuar
    </button>
  </div>
  <div id="mapa"></div>
  <script>
    // Se oculta con visibility y no con display: así el contenedor conserva su tamaño
    // y Leaflet/MapLibre se inicializan con las dimensiones correctas detrás del modal.
    document.getElementById('close-modal').onclick = function () {
      document.getElementById('lab-modal').style.display = 'none';
      document.getElementById('mapa').style.visibility = '';
    };
    document.getElementById('mapa').style.visibility = 'hidden';
  </script>

  <!-- Modal for fullscreen images -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-ajax@2.1.0/dist/leaflet.ajax.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>

  <script>
    const isMobile = window.innerWidth <= 768;

    // Obtener la URL base del sitio web
    const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');

    // Función helper para construir URLs de datos
    function getDataUrl(filename) {
      return baseUrl + 'data/' + filename;
    }

    // Función helper para construir URLs de iconos
    function getIconUrl(filename) {
      return baseUrl + 'icons/' + filename;
    }

    // Función para manejar errores de carga
    function handleLoadError(layerName, url) {
      console.error(`Error cargando ${layerName} desde: ${url}`);
      // Opcional: mostrar mensaje al usuario
      // alert(`Error cargando datos de ${layerName}. Por favor contacta al administrador.`);
    }

    let map = L.map('mapa', {
      scrollWheelZoom: !isMobile,
    }).setView([-14.99, -65.63], 10);

    // Mapa base Voyager en vector: el raster de CARTO pasó a exigir API key (ago. 2026)
    // y devuelve las teselas con marca de agua. El estilo vectorial sigue siendo libre.
    L.maplibreGL({
      style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json'
    }).addTo(map);

    map.attributionControl.addAttribution(
      'Desarrollado por el <a href="https://labtecnosocial.org/">Lab TecnoSocial</a>'
    );

    // Datos de comunidades
    var comunidades = L.geoJSON.ajax(getDataUrl("comunidades_mapeadas.geojson"), {
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng, { icon: iconComunidad });
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(`
          <b>${feature.properties['Nombre']}</b><br>
          <b>Entidad territorial: </b>${feature.properties['entidad_te']}
        `);
      }
    }).on('data:loaded', function () {
      console.log('Comunidades cargadas correctamente');
    }).on('data:loading', function () {
      console.log('Cargando comunidades...');
    });

    const iconComunidad = L.icon({
      iconUrl: getIconUrl('casa.png'),
      iconSize: [36, 38],
      iconAnchor: [15, 40],
      popupAnchor: [0, -35]
    });

    comunidades.addTo(map);

    // moxos-historias
    var historias = L.geoJSON.ajax(getDataUrl("moxos_historias.geojson"), {
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng, { icon: iconHistorias });
      },
      onEachFeature: function (feature, layer) {
        // Crear array de imágenes válidas
        const images = [];
        if (feature.properties['foto1']) images.push(feature.properties['foto1']);
        if (feature.properties['foto2']) images.push(feature.properties['foto2']);
        if (feature.properties['foto3']) images.push(feature.properties['foto3']);

        // Generar el HTML del slideshow
        let slideshowHTML = '';
        if (images.length > 1) {
          slideshowHTML = `
            <div class="slideshow-container">
              <div class="slides">
                ${images.map((img, index) => `
                  <div class="slide ${index === 0 ? 'active' : ''}">
                    <img src="${img}" class="imagen" />
                  </div>
                `).join('')}
              </div>
              <div class="slideshow-controls">
                <button class="prev-btn" onclick="changeSlide(this, -1)">❮</button>
                <span class="slide-counter">1 / ${images.length}</span>
                <button class="next-btn" onclick="changeSlide(this, 1)">❯</button>
              </div>
            </div>
          `;
        } else if (images.length === 1) {
          slideshowHTML = `<img src="${images[0]}" class="imagen" />`;
        }

        layer.bindPopup(`
          ${slideshowHTML}
          <div class="popup-content">
            <b>${feature.properties['Name']}</b>
            <audio controls>
              <source src='${feature.properties['audio']}'/>
            </audio><br>
            <a href='${feature.properties['enlace']}'>Conoce más</a>
          </div>
        `);
      }
    });

    const iconHistorias = L.icon({
      iconUrl: getIconUrl('historia.png'),
      iconSize: [30, 32],
      iconAnchor: [15, 40],
      popupAnchor: [0, -35]
    });

    historias.addTo(map);

    // datos de rios
    var rios = L.geoJSON.ajax(getDataUrl("rios_moxos.geojson"), {
      style: function (feature) {
        return { color: '#1E90FF', weight: 1.5, opacity: 0.3 };
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(`
          <b>Río: </b>${feature.properties['NOMBRE']}
        `);
      }
    });

    rios.addTo(map);

    // datos de hitos
    var hitos = L.geoJSON.ajax(getDataUrl("moxos_hitos.geojson"), {
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng, { icon: iconHitos });
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(`
          <b>${feature.properties['Nombre']}</b>
        `);
      }
    });

    const iconHitos = L.icon({
      iconUrl: getIconUrl('hito.png'),
      iconSize: [38, 40],
      iconAnchor: [15, 40],
      popupAnchor: [0, -35]
    });

    hitos.addTo(map);

    // datos de areas protegidas
    var territoriosIndigenas = L.geoJSON.ajax(getDataUrl("territorios_indigenas.geojson"), {
      style: function (feature) {
        // Paleta de colores suaves pero diferenciados para cada territorio
        const colorPalette = {
          'Baure': '#90EE90',           // Verde claro
          'Canichana': '#FFB6C1',       // Rosa claro
          'Cavineño': '#87CEEB',        // Azul cielo
          'Cayubaba': '#DDA0DD',        // Ciruela claro
          'Chácobo - Pacahuara': '#F0E68C', // Caqui claro
          'Consejo Tsiname': '#FFA07A',  // Salmón claro
          'Isiboro Secure (TIPNIS)': '#20B2AA', // Verde mar claro
          'Itonama': '#AFEEEE',         // Turquesa pálido
          'Joaquiniano': '#F5DEB3',     // Trigo
          'Mojeño Ignaciano': '#98FB98', // Verde pálido
          'Moré': '#E6E6FA',            // Lavanda
          'Movima': '#FFEFD5',          // Papaya
          'Movima II': '#FFE4E1',       // Rosa bruma
          'Multiétnico (TIM)': '#E0FFFF', // Cian claro
          'Sirionó': '#F0FFFF',         // Azul alice
          'Takana - Cavineño': '#FAFAD2', // Vara de oro claro
          'Takana III': '#D3D3D3',      // Gris claro
          'Yuracare (Coniyura)': '#FFFFE0' // Amarillo claro
        };

        const territoryName = feature.properties['name'];
        const fillColor = colorPalette[territoryName] || '#32CD32'; // Default green

        return {
          color: '#CCC',
          weight: 1,
          fillColor: fillColor,
          fillOpacity: 0.4
        };
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(`
          <b>Territorio indígena: </b>${feature.properties['name']}
        `);
      }
    });

    territoriosIndigenas.addTo(map);

    // datos de limite de moxos
    var limiteMoxos = L.geoJSON.ajax(getDataUrl("limite_moxos.geojson"), {
      style: function (feature) {
        return { color: '#FF0000', weight: 2, opacity: 0.2 };
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(`
          <b>Límite de Moxos</b>
        `);
      }
    });

    limiteMoxos.addTo(map);

    // datos de limite de pueblos indigenas
    var limitePueblosIndigenas = L.geoJSON.ajax(getDataUrl("limite_pueblos_moxos.geojson"), {
      style: function (feature) {
        return { color: '#FF8C00', weight: 2, opacity: 0.2 };
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(`
          <b>Límite de Pueblos Indígenas</b>
        `);
      }
    });

    limitePueblosIndigenas.addTo(map);

    // datos de incendios
    var incendios = L.geoJSON.ajax(getDataUrl("incendio.geojson"), {
      style: function (feature) {
        return { color: '#FF4500', weight: 2, opacity: 0.5 };
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(`
          <b>Incendio: </b>${feature.properties['NOMBRE']}
        `);
      }
    });

    incendios.addTo(map);

    // datos de inundaciones
    var inundaciones = L.geoJSON.ajax(getDataUrl("inundaciones.geojson"), {
      style: function (feature) {
        return { color: '#1E90FF', weight: 2, opacity: 0.5 };
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(`
          <b>Inundación: </b>${feature.properties['NOMBRE']}
        `);
      }
    });

    inundaciones.addTo(map);

    // datos de abundancia
    var abundancia = L.geoJSON.ajax(getDataUrl("abundancia_limpia.geojson"), {
      pointToLayer: function (feature, latlng) {
        const iconPath = getIconUrl(feature.properties['extension']);
        const iconAbundancia = L.icon({
          iconUrl: iconPath,
          iconSize: [32, 34],
          iconAnchor: [15, 40],
          popupAnchor: [0, -35]
        });
        return L.marker(latlng, { icon: iconAbundancia });
      },
      onEachFeature: function (feature, layer) {
        layer.bindPopup(`
      <b>${feature.properties['Tipo']}</b>
    `);
      }
    });

    abundancia.addTo(map);

    // Control de capas personalizado
    const CustomLayerControl = L.Control.extend({
      options: {
        position: 'bottomleft'
      },

      onAdd: function (map) {
        const container = L.DomUtil.create('div', 'leaflet-control-layers custom-layer-control');

        container.innerHTML = `
      <div class="layer-control-content">
        <div class="layer-section">
          <div class="layer-section-title">1. Geo-grafías: La historia que narra la tierra</div>
          <label class="layer-item">
            <input type="checkbox" data-layer="comunidades" checked> Comunidades
          </label>
          <label class="layer-item">
            <input type="checkbox" data-layer="limiteMoxos"> Límites del Gran Moxos
          </label>
          <label class="layer-item">
            <input type="checkbox" data-layer="limitePueblosIndigenas"> Territorios ancestrales amazónicos
          </label>
          <label class="layer-item">
            <input type="checkbox" data-layer="territoriosIndigenas"> Tierra indígena titulada
          </label>
        </div>
        
        <div class="layer-section">
          <div class="layer-section-title">2. Contar es sembrar con el corazón (memoria narrada)</div>
          <label class="layer-item">
            <input type="checkbox" data-layer="historias" checked> Historias, paisajes sonoros y fotos
          </label>
          <label class="layer-item">
            <input type="checkbox" data-layer="hitos"> Casas de memoria
          </label>
        </div>
        
        <div class="layer-section">
          <div class="layer-section-title">3. Naturaleza y cambio climático</div>
          <label class="layer-item">
            <input type="checkbox" data-layer="rios"> Nuestros ríos y agua
          </label>
          <label class="layer-item">
            <input type="checkbox" data-layer="incendios"> Incendios
          </label>
          <label class="layer-item">
            <input type="checkbox" data-layer="inundaciones"> Inundaciones
          </label>
          <label class="layer-item">
            <input type="checkbox" data-layer="abundancia"> Chacos y abundancia
          </label>
        </div>
      </div>
    `;

        // Prevenir que los clics en el control se propaguen al mapa
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        // Manejar los checkboxes
        const checkboxes = container.querySelectorAll('input[type="checkbox"]');
        const layerMap = {
          'comunidades': comunidades,
          'limiteMoxos': limiteMoxos,
          'limitePueblosIndigenas': limitePueblosIndigenas,
          'territoriosIndigenas': territoriosIndigenas,
          'historias': historias,
          'hitos': hitos,
          'rios': rios,
          'incendios': incendios,
          'inundaciones': inundaciones,
          'abundancia': abundancia
        };

        checkboxes.forEach(checkbox => {
          checkbox.addEventListener('change', function () {
            const layerName = this.getAttribute('data-layer');
            const layer = layerMap[layerName];

            if (this.checked) {
              map.addLayer(layer);
            } else {
              map.removeLayer(layer);
            }
          });
        });

        return container;
      }
    });

    map.layersControl = new CustomLayerControl().addTo(map);

    map.removeLayer(rios);
    map.removeLayer(hitos);
    map.removeLayer(territoriosIndigenas);
    map.removeLayer(limiteMoxos);
    map.removeLayer(incendios);
    map.removeLayer(inundaciones);
    map.removeLayer(limitePueblosIndigenas);
    map.removeLayer(abundancia);

    // Función para controlar el slideshow
    window.changeSlide = function (button, direction) {
      const slideshowContainer = button.closest('.slideshow-container');
      const slides = slideshowContainer.querySelectorAll('.slide');
      const counter = slideshowContainer.querySelector('.slide-counter');

      let currentSlide = Array.from(slides).findIndex(slide => slide.classList.contains('active'));

      // Remover clase active del slide actual
      slides[currentSlide].classList.remove('active');

      // Calcular nuevo índice
      currentSlide += direction;
      if (currentSlide >= slides.length) currentSlide = 0;
      if (currentSlide < 0) currentSlide = slides.length - 1;

      // Agregar clase active al nuevo slide
      slides[currentSlide].classList.add('active');

      // Actualizar contador
      counter.textContent = `${currentSlide + 1} / ${slides.length}`;
    };


  </script>

  <!-- Script de traducción -->
  <script src="translate.js"></script>
</body>
